<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>小钛 · Wi-Fi 配网</title>
  <style>
    :root { color-scheme:light; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:#1c292e; background:#f5f7f8; letter-spacing:0; }
    * { box-sizing:border-box; }
    body { margin:0; }
    button,input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:disabled { cursor:default; opacity:.5; }
    button:focus-visible,input:focus-visible { outline:3px solid #79cbb7; outline-offset:3px; }
    [hidden] { display:none!important; }
    svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .symbols { position:absolute; width:0; height:0; overflow:hidden; }
    main { width:100%; max-width:480px; min-height:100svh; margin:auto; background:#fff; padding:28px 24px max(24px,env(safe-area-inset-bottom)); }
    header { display:flex; gap:14px; align-items:center; padding:8px 0 28px; }
    .brand { width:48px; height:48px; border-radius:8px; background:#e4f5ef; color:#138466; display:grid; place-items:center; flex-shrink:0; }
    .brand svg { width:28px; height:28px; }
    h1 { font-size:24px; line-height:1.3; margin:0; font-weight:650; }
    .subtitle { color:#687b83; font-size:14px; margin:6px 0 0; }
    h2 { margin:0; font-size:16px; font-weight:650; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; min-height:48px; gap:12px; }
    .icon-button { display:grid; place-items:center; border:0; background:transparent; color:#4d666f; width:48px; height:48px; flex-shrink:0; border-radius:8px; }
    .icon-button:hover { background:#f0f5f4; }
    .status { font-size:13px; line-height:1.65; color:#6b7d84; margin:0 0 14px; min-height:22px; overflow-wrap:anywhere; }
    .status.error { color:#ad3d34; }
    .network-list { margin:0; padding:0; list-style:none; max-height:340px; overflow:auto; overscroll-behavior:contain; }
    .network { display:flex; align-items:center; gap:12px; width:100%; padding:14px 12px; min-height:72px; text-align:left; border:1px solid transparent; border-bottom-color:#e9eeee; background:white; color:inherit; border-radius:0; }
    .network:hover { background:#f6f9f8; }
    .network.selected { background:#edf8f3; border-color:#9bd1be; border-radius:8px; }
    .signal { color:#51716e; width:28px; flex-shrink:0; display:grid; place-items:center; }
    .network-copy { flex:1; min-width:0; }
    .ssid { display:block; font-size:16px; font-weight:600; overflow-wrap:anywhere; line-height:1.4; }
    .network-meta { display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; color:#72838a; font-size:12px; margin-top:5px; }
    .network-meta svg { width:12px; height:12px; }
    .saved { color:#178160; }
    .choice { width:20px; height:20px; border:1.5px solid #ccd7d8; border-radius:50%; flex-shrink:0; display:grid; place-items:center; }
    .selected .choice { background:#148265; color:white; border-color:#148265; }
    .choice svg { width:14px; height:14px; visibility:hidden; }
    .selected .choice svg { visibility:visible; }
    .empty { padding:30px 16px; text-align:center; background:#f7f9f9; color:#74858b; font-size:14px; line-height:1.7; border-radius:8px; }
    .manual { display:flex; justify-content:space-between; align-items:center; width:100%; min-height:52px; margin:8px 0 0; border:0; padding:0 4px; color:#336b62; background:transparent; text-align:left; font-size:14px; }
    form { border-top:1px solid #e5ebeb; margin-top:20px; padding-top:24px; scroll-margin-top:16px; }
    form h2 { margin-bottom:20px; }
    label { display:block; font-size:13px; color:#536970; margin:16px 0 8px; }
    input { width:100%; min-width:0; height:50px; padding:12px 14px; border:1px solid #cfdadb; border-radius:8px; background:#fcfdfd; color:#25373c; font-size:16px; }
    input[readonly] { background:#f2f6f5; color:#586e73; }
    .password-wrap { display:flex; align-items:center; position:relative; }
    .password-wrap input { padding-right:52px; }
    .password-wrap button { position:absolute; right:1px; top:1px; }
    .field-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; }
    .field-meta span { color:#168166; font-size:13px; }
    .text-button { border:0; background:transparent; color:#366c64; font-size:13px; min-height:44px; padding:6px 0 6px 10px; }
    .submit { width:100%; min-height:52px; padding:12px; margin-top:14px; border:0; border-radius:8px; background:#148265; color:white; font-weight:600; display:flex; justify-content:center; align-items:center; gap:10px; }
    .submit:hover:not(:disabled) { background:#09694f; }
    .message { font-size:14px; line-height:1.7; color:#ad3d34; margin:12px 0 0; overflow-wrap:anywhere; }
    .complete { border-top:1px solid #e5ebeb; margin-top:24px; padding-top:24px; }
    .complete svg { color:#148265; width:36px; height:36px; margin-bottom:12px; }
    .complete p { color:#5c7379; font-size:14px; line-height:1.8; }
    footer { margin-top:28px; text-align:center; color:#74868c; font-size:12px; }
    .spinning { animation:spin 1.2s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:360px) { main { padding-left:16px; padding-right:16px; } .network { gap:8px; } }
    @media(prefers-reduced-motion:reduce) { .spinning { animation:none; } }
  </style>
</head>
<body>
  <!-- Lucide icons (ISC); license in web/ICONS_LICENSE.txt. Embedded, no CDN. -->
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.82a15 15 0 0 1 20 0M5 12.859a10 10 0 0 1 14 0M8.5 16.429a5 5 0 0 1 7 0M12 20h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>
  <main>
    <header><div class="brand"><svg aria-hidden="true"><use href="#i-wifi"/></svg></div><div><h1>小钛 Wi-Fi 配网</h1><p class="subtitle">连接网络，让小钛上线</p></div></header>
    <section id="picker" aria-labelledby="nearby-title">
      <div class="section-heading"><h2 id="nearby-title">附近的网络</h2><button id="refresh" class="icon-button" type="button" aria-label="重新扫描网络" title="重新扫描网络"><svg><use href="#i-refresh"/></svg></button></div>
      <p id="status" class="status" role="status" aria-live="polite">正在读取网络列表…</p>
      <ul id="networks" class="network-list" aria-label="Wi-Fi 网络"></ul>
      <div id="empty" class="empty" hidden>没有扫描到网络</div>
      <button id="manual" class="manual" type="button">手动添加网络<svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </section>
    <form id="form" hidden>
      <h2 id="form-title">连接网络</h2>
      <label for="ssid">Wi-Fi 名称</label><input id="ssid" name="ssid" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <div id="password-field">
        <label for="password">Wi-Fi 密码</label>
        <div class="password-wrap"><input id="password" name="password" type="password" maxlength="64" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="请输入密码"><button id="reveal" class="icon-button" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码"><svg aria-hidden="true"><use href="#i-eye"/></svg></button></div>
        <div id="saved-hint" class="field-meta" hidden><span>已保存密码，无需重新输入</span><button id="edit-password" class="text-button" type="button">修改密码</button></div>
      </div>
      <button id="submit" class="submit" type="submit"><span>保存并连接</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
      <p id="message" class="message" role="alert" hidden></p>
    </form>
    <section id="complete" class="complete" role="status" hidden><svg aria-hidden="true"><use href="#i-check"/></svg><h2>配置已保存</h2><p>小钛正在重启并连接 Wi-Fi。手机会断开设备热点，请查看设备屏幕上的联网状态。</p><p>如果没有连上，请重新进入配网页检查网络名称和密码。</p></section>
    <footer>支持 2.4 GHz Wi-Fi</footer>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    let networks = [], selected = null, useSaved = false, submitting = false, done = false;
    let pollTimer = 0, scanDeadline = 0, loading = false;
    const icon = name => {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      const use = document.createElementNS(svg.namespaceURI, 'use');
      use.setAttribute('href', '#i-' + name); svg.appendChild(use); svg.setAttribute('aria-hidden', 'true'); return svg;
    };
    function status(text, error = false) { $('status').textContent = text; $('status').classList.toggle('error', error); }
    function message(text) { $('message').textContent = text; $('message').hidden = !text; }
    function scanning(value) { $('refresh').disabled = value || submitting; $('refresh').firstElementChild.classList.toggle('spinning', value); }
    async function request(path, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 9000);
      try {
        const response = await fetch(path, {...options, cache:'no-store', signal:controller.signal});
        return {ok:response.ok, status:response.status, body:await response.text()};
      }
      finally { clearTimeout(timer); }
    }
    function signalLabel(rssi) { return rssi >= -60 ? '信号强' : rssi >= -75 ? '信号良好' : '信号较弱'; }
    function render() {
      $('networks').replaceChildren();
      const sorted = [...networks].sort((a,b) => Number(b.available)-Number(a.available) || Number(b.saved)-Number(a.saved) || b.rssi-a.rssi);
      for (const network of sorted) {
        const li = document.createElement('li'), button = document.createElement('button');
        const isSelected = selected && network.ssid === selected.ssid;
        button.type = 'button'; button.className = 'network' + (isSelected ? ' selected' : '');
        button.setAttribute('aria-pressed', String(Boolean(isSelected))); button.disabled = !network.supported || submitting;
        const signal = document.createElement('span'); signal.className = 'signal'; signal.appendChild(icon('wifi'));
        const copy = document.createElement('span'); copy.className = 'network-copy';
        const name = document.createElement('span'); name.className = 'ssid'; name.textContent = network.ssid;
        const meta = document.createElement('span'); meta.className = 'network-meta';
        if (network.secured) meta.appendChild(icon('lock'));
        const detail = document.createElement('span');
        detail.textContent = !network.supported ? '暂不支持此认证方式' : network.available ? signalLabel(network.rssi) + (network.secured ? '' : ' · 无需密码') : '暂未扫描到';
        meta.appendChild(detail);
        if (network.saved) { const saved = document.createElement('span'); saved.className = 'saved'; saved.textContent = '已保存'; meta.appendChild(saved); }
        copy.append(name,meta);
        const choice = document.createElement('span'); choice.className = 'choice'; choice.appendChild(icon('check'));
        button.append(signal,copy,choice); button.addEventListener('click', () => select(network)); li.appendChild(button); $('networks').appendChild(li);
      }
    }
    function setPasswordMode(saved, secured) {
      useSaved = saved;
      $('password').value = ''; $('password').type = 'password'; $('password').readOnly = saved;
      $('password').placeholder = saved ? '使用已保存的密码' : '请输入密码';
      $('password').required = secured && !saved;
      $('password-field').hidden = !secured;
      $('saved-hint').hidden = !saved; $('reveal').hidden = saved;
      $('reveal').setAttribute('aria-pressed','false'); $('reveal').setAttribute('aria-label','显示密码'); $('reveal').title = '显示密码';
    }
    function select(network) {
      if (submitting) return;
      selected = network; $('ssid').value = network ? network.ssid : ''; $('ssid').readOnly = Boolean(network);
      $('form-title').textContent = network ? '连接网络' : '手动添加网络';
      $('form').hidden = false; setPasswordMode(Boolean(network && network.saved), !network || network.secured);
      if (!network) { $('password').required = false; $('password').placeholder = '开放网络可留空'; }
      message(''); render();
      $('form').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      if (!network) $('ssid').focus({preventScroll:true});
    }
    async function refreshState() {
      if (loading || submitting || done) return;
      loading = true;
      try {
        const response = await request('/api/networks');
        if (!response.ok) throw new Error('list');
        if (submitting || done) return;
        const data = JSON.parse(response.body); networks = data.networks; render();
        const pending = data.state === 'queued' || data.state === 'scanning';
        $('empty').hidden = networks.length > 0;
        $('empty').textContent = pending ? '正在搜索附近的 Wi-Fi…' : '未发现网络，可以重新扫描或手动添加。';
        if (pending && Date.now() < scanDeadline) {
          status('正在扫描附近网络…'); scanning(true); pollTimer = setTimeout(refreshState, 1000);
        } else {
          scanning(false);
          if (pending) status('扫描等待超时，请重新扫描。', true);
          else if (data.state === 'error') status(data.busy ? '设备正在重连已保存的网络，请稍后重新扫描。也可直接选择已保存的网络。' : '本次扫描失败，请重新扫描。已有列表为上次结果。', true);
          else if (data.history_unavailable) status('已保存的网络暂不可用，请手动输入密码。', true);
          else status(data.truncated ? '附近网络较多，展示部分结果，可重新扫描。' : '附近网络 ' + networks.filter(n => n.available).length + ' 个');
        }
      } catch (_) { scanning(false); status('连接中断，请确认手机仍连接着小钛热点，然后重新扫描。', true); }
      finally { loading = false; }
    }
    async function scan() {
      if (submitting || done || loading) return;
      clearTimeout(pollTimer); scanning(true); status('正在扫描附近网络…'); scanDeadline = Date.now() + 20000;
      try {
        const response = await request('/api/scan', {method:'POST'});
        if (!response.ok) throw new Error('scan');
        await refreshState();
      } catch (_) { scanning(false); status('无法开始扫描，请确认手机连接着小钛热点后重试。', true); }
    }
    $('refresh').addEventListener('click', scan);
    $('manual').addEventListener('click', () => select(null));
    $('edit-password').addEventListener('click', () => { setPasswordMode(false, true); $('password').focus(); });
    $('reveal').addEventListener('click', () => {
      const show = $('password').type === 'password'; $('password').type = show ? 'text' : 'password';
      $('reveal').setAttribute('aria-pressed', String(show)); $('reveal').setAttribute('aria-label',show ? '隐藏密码' : '显示密码'); $('reveal').title = show ? '隐藏密码' : '显示密码';
    });
    $('form').addEventListener('submit', async event => {
      event.preventDefault(); if (submitting || done) return;
      const ssid = $('ssid').value, password = $('password').value;
      const byteLength = text => new TextEncoder().encode(text).length;
      if (!ssid || byteLength(ssid) > 32) { message('Wi-Fi 名称需为 1–32 字节，请检查名称长度。'); return; }
      if (!useSaved && password && (byteLength(password) < 8 || byteLength(password) > 64)) { message('密码需为 8–64 字节，请重新检查。'); return; }
      submitting = true; clearTimeout(pollTimer); scanning(false); render();
      $('submit').disabled = true; $('manual').disabled = true; $('edit-password').disabled = true; $('ssid').disabled = true; $('password').disabled = true;
      $('submit').firstElementChild.textContent = '正在保存…'; message('');
      try {
        const payload = useSaved ? {ssid, use_saved:true} : {ssid, password};
        const response = await request('/api/wifi', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if (!response.ok) { message(response.status === 400 ? '配置未被接受，请检查名称和密码；已保存的网络可尝试修改密码后重试。' : '设备未确认保存成功，请稍后重试。'); return; }
        done = true; $('picker').hidden = true; $('form').hidden = true; $('complete').hidden = false;
        $('password').value = ''; $('complete').scrollIntoView({block:'start'});
      } catch (_) { message('未收到保存结果。设备可能已重启，请先查看设备屏幕；若未联网，再连回小钛热点重试。'); }
      finally {
        submitting = false; $('submit').disabled = false; $('manual').disabled = false; $('edit-password').disabled = false; $('ssid').disabled = false; $('password').disabled = false;
        $('submit').firstElementChild.textContent = '保存并连接'; scanning(false); render();
      }
    });
    // Captive-network probes may arrive through arbitrary host names. Keep
    // credential requests on the canonical AP origin, with no external assets.
    if (location.protocol === 'http:' && location.host !== '192.168.6.1') location.replace('http://192.168.6.1/');
    else if (location.protocol === 'http:') { refreshState().then(scan); }
    else { status('页面预览：实际网络列表需连接设备热点后加载。'); $('empty').hidden = false; $('empty').textContent = '请在设备热点中打开 192.168.6.1'; }
  </script>
</body>
</html>
