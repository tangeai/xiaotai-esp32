<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>小钛 Wi-Fi</title>
<style>
:root{--ink:#20292d;--muted:#647277;--line:#e2e8e8;--green:#19715e;--blue:#235ec7;--error:#b33c31}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;color:var(--ink);background:#f5f7f7;font:16px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid #70adf1;outline-offset:3px}
button,input{border-radius:8px}svg.icon{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}main{max-width:540px;min-height:100vh;margin:auto;padding:28px 22px max(28px,env(safe-area-inset-bottom));background:white}
header{display:flex;align-items:center;gap:12px;padding:0 0 24px;border-bottom:1px solid var(--line)}header>.icon{width:36px;height:36px;color:var(--green)}h1{font-size:24px;line-height:1.25;margin:0;font-weight:650}header p{font-size:13px;color:var(--muted);margin:5px 0 0}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}h2{font-size:16px;margin:0;font-weight:600}.count{margin-left:8px;color:var(--muted);font-size:13px;font-weight:400}
.icon-button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:white;color:var(--muted);padding:0}
.networks{display:grid;gap:6px}.network{display:flex;align-items:center;gap:12px;min-height:72px;width:100%;text-align:left;border:1px solid transparent;background:#f6f8f8;color:var(--ink);padding:12px;transition:background .15s,border-color .15s}
.network:hover{background:#edf2f1}.network[aria-pressed=true]{border-color:var(--green);background:#eaf5f0}.network[aria-pressed=true]>.icon{color:var(--green)}
.network-copy{flex:1;min-width:0}.network-name{display:block;font-weight:550;overflow-wrap:anywhere;line-height:1.4}.network-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}.network-meta .icon{height:12px;width:12px}.saved{color:var(--green)}.weak{color:#ac5630}.selected-mark{width:22px;flex:none;color:var(--green)}
.notice{color:var(--muted);font-size:14px;min-height:22px;margin:10px 0}.notice.error{color:var(--error)}.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:14px}
.text-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:var(--blue);padding:10px 0;min-height:44px;font-size:14px}.text-button .icon{height:18px;width:18px}
form{border-top:1px solid var(--line);margin-top:12px;padding-top:24px}fieldset{padding:0;border:0;margin:0;min-width:0}.field{margin-bottom:18px}label{display:block;font-size:14px;font-weight:550;margin-bottom:8px}input{width:100%;height:50px;border:1px solid #bdc9cc;background:white;padding:0 12px;color:var(--ink);min-width:0}input[readonly]{background:#f4f7f6;color:#42615a}
.password-row{display:flex;position:relative}.password-row input{padding-right:52px}.password-row .icon-button{position:absolute;right:4px;top:3px;border:0;background:transparent}.field-tools{display:flex;justify-content:space-between;gap:8px;align-items:center}.field-tools p{font-size:13px;color:var(--muted);margin:6px 0}.field-tools .text-button{flex:none}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--blue);color:white;border:0;width:100%;min-height:52px;padding:12px;font-weight:600}.primary:hover{background:#174cae}.result{font-size:14px;overflow-wrap:anywhere;margin:14px 0 0;min-height:22px;color:var(--green)}.result.error{color:var(--error)}
footer{padding-top:20px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}footer .icon{width:14px;height:14px}
.spin{animation:rotate 1s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:350px){main{padding:20px 14px}.network{gap:8px;padding:10px}}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.859a10 10 0 0 1 14 0M8.5 16.429a5 5 0 0 1 7 0"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49M14.084 14.158a3 3 0 0 1-4.242-4.242M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143M2 2l20 20"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
</defs></svg>
<main>
<header><svg class="icon" aria-hidden="true"><use href="#i-wifi"/></svg><div><h1>小钛 Wi-Fi</h1><p>网络设置 · 2.4 GHz</p></div></header>
<section aria-labelledby="nearby-title">
<div class="heading"><h2 id="nearby-title">附近网络<span class="count" id="count"></span></h2><button type="button" class="icon-button" id="refresh" aria-label="刷新网络" title="刷新网络"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
<div class="networks" id="nearby"></div><div class="empty" id="empty">正在读取网络…</div>
<p id="scan-note" class="notice" role="status" aria-live="polite"></p>
</section>
<section id="history-section" hidden aria-labelledby="history-title"><div class="heading"><h2 id="history-title">已保存的网络</h2></div><div class="networks" id="history"></div></section>
<button type="button" class="text-button" id="manual"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>其他网络</button>
<form id="form" hidden novalidate>
<fieldset id="fields">
<div class="field"><label for="ssid">Wi-Fi 名称</label><input id="ssid" name="ssid" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="网络名称" required></div>
<div class="field" id="password-field"><label for="password">密码</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="请输入 Wi-Fi 密码"><button type="button" class="icon-button" id="show-password" aria-label="显示密码" title="显示密码"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></div><div class="field-tools"><p id="password-note"></p><button type="button" class="text-button" id="edit-password" hidden>更换密码</button></div></div>
<button type="submit" class="primary" id="save">保存并连接</button>
</fieldset>
<p class="result" id="result" role="status" aria-live="polite"></p>
</form>
<footer><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>已保存密码仅在设备内复用</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const state = {networks:[], selected:null, saved:false, scanning:false, saving:false, done:false};
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','icon'); svg.setAttribute('aria-hidden','true');
  const use = document.createElementNS(svg.namespaceURI,'use'); use.setAttribute('href','#i-'+name); svg.append(use); return svg;
}
function text(tag, value, className) { const node=document.createElement(tag); node.textContent=value; if(className) node.className=className; return node; }
function identity(network) { return network.ssid_hex+':'+network.secure+':'+network.supported; }
function message(id, value, error=false) { $(id).textContent=value; $(id).classList.toggle('error',error); }
async function request(url, options={}) {
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),8000);
  try { const response=await fetch(url,{...options,signal:controller.signal,cache:'no-store'}); const body=await response.text();
    if(!response.ok) { const error=new Error(body); error.status=response.status; throw error; } return body;
  } finally { clearTimeout(timer); }
}
function renderNetworks() {
  $('nearby').replaceChildren(); $('history').replaceChildren();
  const nearby=state.networks.filter(n=>n.available).sort((a,b)=>Number(b.saved)-Number(a.saved)||b.rssi-a.rssi);
  const history=state.networks.filter(n=>!n.available);
  for(const network of [...nearby,...history]) {
    const row=document.createElement('button'); row.type='button'; row.className='network';
    row.setAttribute('aria-pressed',String(state.selected!==null && identity(network)===identity(state.selected)));
    row.disabled=!network.supported||state.saving||state.done;
    const signal=icon('wifi'); if(network.available && network.rssi < -75) signal.style.opacity='.45'; row.append(signal);
    const copy=text('span','', 'network-copy'); copy.append(text('span',network.ssid,'network-name'));
    const meta=text('span','', 'network-meta');
    if(network.saved) meta.append(text('span','已保存','saved'));
    if(!network.supported) meta.append(text('span','暂不支持此加密方式'));
    else if(!network.available) meta.append(text('span','本次未发现'));
    else meta.append(text('span',network.rssi>=-60?'信号强':network.rssi>=-75?'信号良好':'信号较弱',network.rssi < -75?'weak':''));
    if(network.secure) meta.append(icon('lock')); else meta.append(text('span','开放网络'));
    copy.append(meta); row.append(copy);
    const mark=text('span','', 'selected-mark'); if(row.getAttribute('aria-pressed')==='true') mark.append(icon('check')); row.append(mark);
    row.addEventListener('click',()=>selectNetwork(network));
    $(network.available?'nearby':'history').append(row);
  }
  $('count').textContent=nearby.length?String(nearby.length):'';
  $('empty').hidden=nearby.length>0; $('empty').textContent=state.scanning?'正在扫描附近网络…':'没有发现附近网络';
  $('history-section').hidden=history.length===0;
}
function setPasswordMode(saved, secure) {
  state.saved=saved; $('password-field').hidden=!secure; $('password').value=''; $('password').type='password';
  $('password').readOnly=saved; $('password').placeholder=saved?'已保存密码':'请输入 Wi-Fi 密码';
  $('edit-password').hidden=!saved; $('show-password').hidden=saved; $('show-password').setAttribute('aria-label','显示密码');
  $('show-password').title='显示密码'; $('show-password').replaceChildren(icon('eye'));
  $('password-note').textContent=saved?'已自动选用保存的密码':state.selected?'8–64 字节':'开放网络可留空';
}
function selectNetwork(network) {
  if(state.saving||state.done) return;
  state.selected=network; $('ssid').value=network.ssid; $('ssid').readOnly=true;
  setPasswordMode(network.saved&&network.secure,network.secure); message('result','');
  $('form').hidden=false; renderNetworks(); $('form').scrollIntoView({block:'nearest',behavior:'smooth'});
  if(network.secure&&!network.saved) $('password').focus({preventScroll:true});
}
$('manual').addEventListener('click',()=>{
  if(state.saving||state.done) return;
  state.selected=null; $('ssid').value=''; $('ssid').readOnly=false; setPasswordMode(false,true);
  $('form').hidden=false; message('result',''); renderNetworks(); $('ssid').focus();
});
$('edit-password').addEventListener('click',()=>{setPasswordMode(false,true); $('password').focus();});
$('show-password').addEventListener('click',()=>{
  const reveal=$('password').type==='password'; $('password').type=reveal?'text':'password';
  const label=reveal?'隐藏密码':'显示密码'; $('show-password').setAttribute('aria-label',label); $('show-password').title=label;
  $('show-password').replaceChildren(icon(reveal?'eye-off':'eye'));
});
async function loadNetworks() {
  const data=JSON.parse(await request('/api/wifi/networks'));
  if(!Array.isArray(data.networks)) throw new Error('invalid networks');
  // Keep the last result visible while radio ownership is busy or scanning.
  if(!state.networks.length || (data.state!=='scanning' && data.state!=='busy')) state.networks=data.networks;
  renderNetworks();
  if(data.history_error) message('scan-note','暂时无法读取已保存网络，仍可输入密码连接。',true);
  return data;
}
async function scan() {
  if(state.scanning||state.saving||state.done) return;
  state.scanning=true; $('refresh').disabled=true; $('refresh').firstElementChild.classList.add('spin');
  message('scan-note','正在扫描…'); renderNetworks();
  try {
    await request('/api/wifi/scan',{method:'POST'});
    const end=Date.now()+12000;
    let data;
    do { await new Promise(resolve=>setTimeout(resolve,650)); data=await loadNetworks(); }
    while(data.state==='scanning' && Date.now()<end && !state.saving && !state.done);
    if(state.saving||state.done) return;
    if(data.state==='ready') message('scan-note',data.history_error?'扫描完成，已保存网络读取失败。':'扫描完成',data.history_error);
    else if(data.state==='busy') message('scan-note','设备正在连接或刚完成扫描，请稍后刷新。');
    else message('scan-note','扫描未完成，请稍后重试；也可手动填写网络。',true);
  } catch(error) { if(!state.saving&&!state.done) message('scan-note','暂时无法读取网络，请确认手机仍连接小钛热点。',true); }
  finally { state.scanning=false; $('refresh').disabled=state.saving||state.done; $('refresh').firstElementChild.classList.remove('spin'); renderNetworks(); }
}
$('refresh').addEventListener('click',scan);
$('form').addEventListener('submit',async event=>{
  event.preventDefault(); if(state.saving||state.done) return;
  const ssid=$('ssid').value, password=$('password').value, bytes=value=>new TextEncoder().encode(value).length;
  if(!state.selected && (bytes(ssid)<1||bytes(ssid)>32)) { message('result','Wi-Fi 名称需为 1–32 字节。',true); $('ssid').focus(); return; }
  const secure=state.selected?state.selected.secure:password.length>0;
  if(!state.saved && secure && (bytes(password)<8||bytes(password)>64)) { message('result','密码需为 8–64 字节。',true); $('password').focus(); return; }
  const payload={ssid}; if(state.selected) payload.ssid_hex=state.selected.ssid_hex;
  if(state.saved) payload.use_saved=true; else payload.password=secure?password:'';
  state.saving=true; $('fields').disabled=true; $('manual').disabled=true; $('refresh').disabled=true;
  $('save').textContent='正在保存…'; message('result','正在保存网络设置…'); renderNetworks();
  try {
    const result=await request('/api/wifi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    state.done=true; $('password').value=''; $('save').replaceChildren(icon('check'),document.createTextNode('已保存'));
    message('result',result);
  } catch(error) {
    if(error.status===409) { setPasswordMode(false,true); message('result','保存的密码已不可用，请重新输入。',true); }
    else if(error.status) message('result','未能保存网络设置，请检查名称、密码后重试。',true);
    else message('result','保存结果未确认，请先查看设备是否已重启；未重启时再尝试。',true);
    $('save').textContent='保存并连接';
  } finally {
    state.saving=false; $('fields').disabled=state.done; $('manual').disabled=state.done;
    $('refresh').disabled=state.scanning||state.done; renderNetworks();
  }
});
(async()=>{try{await loadNetworks();}catch(error){message('scan-note','正在重新读取网络…');} await scan();})();
</script>
</body>
</html>
