dependencies:
  # Own the shared ES8311/ES7210 I2S bus through the same duplex adapter used
  # by the verified device-monitor reference.  Do not let independent codec
  # drivers reconfigure TX and RX clocks separately.
  espressif/esp_codec_dev:
    version: ">=1.1.0"
  espressif/esp_audio_codec:
    version: "==2.4.0"
  espressif/esp-sr:
    version: "==2.4.7"
  idf:
    version: ">=5.5,<5.6"
